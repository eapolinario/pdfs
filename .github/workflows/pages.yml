# Builds and deploys https://eapolinario.github.io/pdfs/ on every push to main.
#
# metadata.md is the source of truth: build.py parses it, fails the build if it
# disagrees with files/, and assembles _site (page + manifest.json + the PDFs).
# The collection is small enough to serve the PDFs from Pages directly; if it
# ever approaches the 1 GB artifact limit, link to raw.githubusercontent.com
# instead of copying files/ into the site.

name: pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.site/**'
      - 'metadata.md'
      - 'files/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test the metadata parser
        run: python3 .site/test_build.py

      - name: Build the site
        run: python3 .site/build.py --assemble _site --commit "${GITHUB_SHA}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
